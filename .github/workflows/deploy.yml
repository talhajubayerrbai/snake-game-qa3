name: Deploy snake-game-qa3

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Git SHA to deploy'
        required: false
        default: ''
      udap_run_id:
        description: 'UDAP run ID'
        required: false
        default: ''

concurrency:
  group: deploy-${{ vars.TF_STATE_KEY }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Stage 1: Test ──────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform validate (lint)
        run: |
          cd infra
          terraform init -backend=false
          terraform validate

  # ── Stage 2: Provision ────────────────────────────────────────────────────
  provision:
    name: Provision
    runs-on: ubuntu-latest
    needs: test
    outputs:
      instance_public_ip: ${{ steps.tf_output.outputs.instance_public_ip }}
      instance_id: ${{ steps.tf_output.outputs.instance_id }}
      artifact_bucket_name: ${{ steps.tf_output.outputs.artifact_bucket_name }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false

      - name: Terraform init
        run: |
          cd infra
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform apply
        run: |
          cd infra
          terraform apply -input=false -auto-approve \
            -var="ssh_public_key=${{ vars.SSH_PUBLIC_KEY }}" \
            -var="aws_region=${{ vars.AWS_REGION }}"

      - name: Capture Terraform outputs
        id: tf_output
        run: |
          cd infra
          echo "instance_public_ip=$(terraform output -raw instance_public_ip)" >> $GITHUB_OUTPUT
          echo "instance_id=$(terraform output -raw instance_id)"               >> $GITHUB_OUTPUT
          echo "artifact_bucket_name=$(terraform output -raw artifact_bucket_name)" >> $GITHUB_OUTPUT

      - name: Build and upload versioned artifact
        run: |
          SHA="${{ inputs.revision || github.sha }}"
          ARTIFACT="snake-game-${SHA}.tar.gz"
          BUCKET="${{ steps.tf_output.outputs.artifact_bucket_name }}"
          tar czf "/tmp/${ARTIFACT}" \
            --warning=no-file-changed \
            index.html game.js
          aws s3 cp "/tmp/${ARTIFACT}" "s3://${BUCKET}/${ARTIFACT}"
          echo "Uploaded s3://${BUCKET}/${ARTIFACT}"

  # ── Stage 3: Configure ────────────────────────────────────────────────────
  configure:
    name: Configure
    runs-on: ubuntu-latest
    needs: provision
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_IP: ${{ needs.provision.outputs.instance_public_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Install Ansible
        run: |
          pip install ansible boto3 botocore

      - name: Write SSH private key
        run: |
          echo "${{ secrets.SNAKE_SSH_PRIVATE_KEY }}" > /tmp/snake_ssh_key
          chmod 600 /tmp/snake_ssh_key

      - name: Wait for SSH to be ready
        run: |
          for i in $(seq 1 20); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
               -i /tmp/snake_ssh_key ec2-user@${INSTANCE_IP} 'echo ready' 2>/dev/null; then
              echo "SSH is up"
              break
            fi
            echo "Attempt $i: SSH not ready, waiting 15s..."
            sleep 15
          done

      - name: Generate inventory
        run: |
          cat > /tmp/inventory.ini <<EOF
          [snake_game]
          ${INSTANCE_IP} ansible_user=ec2-user ansible_ssh_private_key_file=/tmp/snake_ssh_key ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ConnectTimeout=30'
          EOF

      - name: Run Ansible playbook
        run: |
          SHA="${{ inputs.revision || github.sha }}"
          ansible-playbook ansible/configure.yml \
            -i /tmp/inventory.ini \
            --extra-vars "artifact_version=${SHA}" \
            -v

  # ── Stage 4: Verify ───────────────────────────────────────────────────────
  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [provision, configure]
    env:
      INSTANCE_IP: ${{ needs.provision.outputs.instance_public_ip }}
    steps:
      - name: Poll /health until 200 (up to 2 minutes)
        run: |
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${INSTANCE_IP}/health" || echo "000")
            echo "Attempt $i: /health returned ${STATUS}"
            if [ "${STATUS}" = "200" ]; then
              echo "Health check passed!"
              break
            fi
            if [ "$i" = "24" ]; then
              echo "Health check timed out after 2 minutes"
              exit 1
            fi
            sleep 5
          done

      - name: Verify unknown path returns 404
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${INSTANCE_IP}/nonexistent")
          echo "Unknown path returned: ${STATUS}"
          if [ "${STATUS}" != "404" ]; then
            echo "Expected 404, got ${STATUS}"
            exit 1
          fi
          echo "404 check passed!"

      - name: Print public URL
        run: |
          echo "Live URL: http://${INSTANCE_IP}/"
          echo "Health:   http://${INSTANCE_IP}/health"
          echo "Game:     http://${INSTANCE_IP}/"
