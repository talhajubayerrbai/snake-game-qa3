server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health check
    location = /health {
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # Serve static game files
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location = /game.js {
        try_files $uri =404;
    }

    # Everything else -> 404
    location / {
        return 404;
    }
}
